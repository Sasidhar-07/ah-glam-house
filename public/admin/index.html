<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AH Glam House — Admin</title><style>
:root{--bg:#fbf4ed;--paper:#fffaf5;--ink:#4a3027;--muted:#80685d;--gold:#b47a31;--rose:#d9857c;--line:rgba(145,101,55,.2)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(1200px,94%);margin:auto}.login{min-height:100vh;display:grid;place-items:center}.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 20px 70px #5f3d2a14}.login .card{width:min(420px,92vw)}h1,h2{font-family:Georgia,serif;font-weight:500}label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;display:block;margin:14px 0 6px}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}.btn{border:0;border-radius:999px;padding:12px 18px;cursor:pointer;background:#6a4537;color:#fff;font-weight:700}.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--gold)}.hidden{display:none}.top{padding:20px 0;display:flex;justify-content:space-between;align-items:center;gap:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:15px 0 25px}.stat{padding:20px;background:var(--paper);border:1px solid var(--line);border-radius:18px}.stat b{display:block;font-size:30px}.table-wrap{overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.1em}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f2e3d6;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap}.msg{margin-top:12px;font-size:13px}.ok{color:#28734c}.err{color:#a23b32}.muted{color:var(--muted);font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:#4a3027;color:white;padding:15px 18px;border-radius:14px;display:none;box-shadow:0 12px 35px #0002}.filters{display:flex;gap:10px;margin-bottom:15px}.filters select{max-width:220px}@media(max-width:700px){.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div id="login" class="login"><div class="card"><h1>AH Glam House</h1><p class="muted">Secure appointment dashboard</p><label>Username</label><input id="user" value="admin"><label>Password</label><input id="pass" type="password"><button class="btn" style="width:100%;margin-top:18px" onclick="login()">Sign in</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app" class="hidden"><div class="wrap"><div class="top"><div><h1 style="margin-bottom:4px">Appointments</h1><div class="muted">Live AH Glam House booking dashboard</div></div><button class="btn alt" onclick="logout()">Log out</button></div><div class="stats"><div class="stat">Pending<b id="pending">0</b></div><div class="stat">Confirmed<b id="confirmed">0</b></div><div class="stat">Total<b id="total">0</b></div></div><div class="filters"><select id="filter" onchange="load()"><option value="">All appointments</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><button class="btn alt" onclick="load()">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Booking</th><th>Customer</th><th>Service</th><th>Event</th><th>Details</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div id="toast" class="toast"></div>
<script>
let token=localStorage.getItem('ah_admin_token');if(token)showApp();
function msg(t,ok=false){const e=document.getElementById('loginMsg');e.textContent=t;e.className='msg '+(ok?'ok':'err')}
async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});const d=await r.json();if(!r.ok)return msg(d.error);token=d.token;localStorage.setItem('ah_admin_token',token);showApp()}
function logout(){localStorage.removeItem('ah_admin_token');location.reload()}
function showApp(){login.classList.add('hidden');app.classList.remove('hidden');load();if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();const es=new EventSource('/api/admin/events?token='+encodeURIComponent(token));es.addEventListener('booking',()=>{load();toast('New appointment received ✨');if('Notification' in window&&Notification.permission==='granted')new Notification('AH Glam House — New Booking',{body:'A new appointment request has arrived.'})});es.addEventListener('booking_update',()=>load());es.onerror=()=>{};}
async function load(){const st=document.getElementById('filter').value;const r=await fetch('/api/admin/bookings'+(st?'?status='+encodeURIComponent(st):''),{headers:{Authorization:'Bearer '+token}});if(r.status===401)return logout();const data=await r.json();render(data)}
function render(data){pending.textContent=data.filter(x=>x.status==='pending').length;confirmed.textContent=data.filter(x=>x.status==='confirmed').length;total.textContent=data.length;rows.innerHTML=data.map(b=>`<tr><td>#${b.id}<br><span class="muted">${new Date(b.created_at).toLocaleString('en-IN')}</span></td><td><b>${esc(b.name)}</b><br><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a><br><a target="_blank" href="https://wa.me/${esc(b.phone).replace(/\D/g,'')}">WhatsApp</a></td><td>${esc(b.service)}</td><td>${esc(b.event_date||'—')}<br>${esc(b.event_time||'—')}</td><td>${esc(b.message||'—')}</td><td><span class="pill">${esc(b.status)}</span></td><td><div class="actions">${['pending','confirmed','completed','cancelled'].map(s=>`<button class="btn alt" onclick="setStatus(${b.id},'${s}')">${s}</button>`).join('')}<button class="btn alt" onclick="del(${b.id})">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="7">No appointments found.</td></tr>'}
async function setStatus(id,status){await fetch('/api/admin/bookings/'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({status})});load()}
async function del(id){if(!confirm('Delete this appointment permanently?'))return;await fetch('/api/admin/bookings/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});load()}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
